name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload runnable foundation JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grimholt-server-${{ github.sha }}
          path: target/grimholt-server-*.jar
          if-no-files-found: error
          retention-days: 30
