name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.0"
      - name: Test
        run: gradle --no-daemon clean test
      - name: Vanilla 26.2 reference smoke test
        run: gradle --no-daemon --no-configuration-cache vanillaReferenceSmoke26_2

      - name: Assemble
        run: gradle --no-daemon assemble

      - name: Upload standalone server JAR
        uses: actions/upload-artifact@v4
        with:
          name: grimholt-server-standalone
          path: build/libs/*-standalone.jar
          if-no-files-found: error
