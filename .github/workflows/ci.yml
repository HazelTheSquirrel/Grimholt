name: CI

on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.0"
      - name: Materialize Mojang 26.4 snapshot 3 reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference/minecraft/26.4
          if [ ! -f reference/minecraft/26.4/server.jar ]; then
            git fetch origin test
            git checkout -B test origin/test
            curl --fail --location --retry 3 \
              -o reference/minecraft/26.4/server.jar \
              https://piston-data.mojang.com/v1/objects/2d89c95c030e635387448f332961074ce1adbb4b/server.jar
            echo "2d89c95c030e635387448f332961074ce1adbb4b  reference/minecraft/26.4/server.jar" | sha1sum --check -
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reference/minecraft/26.4/server.jar
            git commit -m "chore(reference): add Minecraft 26.4 snapshot 3 server jar"
            git push origin HEAD:test
          fi
      - name: Test
        run: gradle --no-daemon clean test
      - name: Vanilla 26.4 snapshot 3 reference smoke test
        run: gradle --no-daemon --no-configuration-cache vanillaReferenceSmoke26_4

      - name: Assemble
        run: gradle --no-daemon assemble

      - name: Upload standalone server JAR
        uses: actions/upload-artifact@v4
        with:
          name: grimholt-server-standalone
          path: build/libs/*-standalone.jar
          if-no-files-found: error
