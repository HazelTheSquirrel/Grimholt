name: CI

concurrency:
  group: grimholt-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.0"
      - name: Verify Mojang 26.4 snapshot 3 reference
        shell: bash
        run: |
          set -euo pipefail
          test -f reference/minecraft/26.4/server.jar
          echo "2d89c95c030e635387448f332961074ce1adbb4b  reference/minecraft/26.4/server.jar" | sha1sum --check -
      - name: Test
        run: gradle --no-daemon --no-configuration-cache clean test
      - name: Vanilla 26.4 snapshot 3 reference smoke test
        run: gradle --no-daemon --no-configuration-cache vanillaReferenceSmoke26_4
      - name: Assemble
        run: gradle --no-daemon --no-configuration-cache assemble
      - name: Upload standalone server JAR
        uses: actions/upload-artifact@v4
        with:
          name: grimholt-server-standalone
          path: build/libs/*-standalone.jar
          if-no-files-found: error
